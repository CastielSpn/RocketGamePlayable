<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ракетная игра - Уклонение от астероидов</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f0f23, #1a1a3e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #4a4a6a;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(74, 74, 106, 0.5);
        }
        
        #gameCanvas {
            display: block;
            border-radius: 8px;
        }
        
        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 8px;
        }
        
        #nextLevelScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 20, 40, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 8px;
        }
        
        .game-button {
            padding: 15px 30px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        
        .game-title {
            color: white;
            font-size: 36px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .game-subtitle {
            color: #ffeb3b;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        #instructions {
            position: absolute;
            bottom: 80px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        
        .mobile-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .left-btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
        }
        
        .right-btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }
        
        .shoot-btn {
            background: linear-gradient(45deg, #ffd93d, #ff8c00);
            color: white;
        }
        
        .mobile-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        
        /* Скрываем кнопки на больших экранах */
        @media (min-width: 768px) {
            #mobileControls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="gameUI">
            <div>Очки: <span id="score">0</span></div>
            <div>Этап: <span id="level">1</span></div>
            <div>Жизни: <span id="lives">3</span></div>
        </div>
        
        <div id="instructions">
            Используйте стрелки ← → для управления ракетой
        </div>
        
        <!-- Мобильные кнопки управления -->
        <div id="mobileControls">
            <button class="mobile-btn left-btn" onmousedown="startMoveLeft()" onmouseup="stopMoveLeft()" ontouchstart="startMoveLeft()" ontouchend="stopMoveLeft()">←</button>
            <button class="mobile-btn shoot-btn" onmousedown="startShoot()" onmouseup="stopShoot()" ontouchstart="startShoot()" ontouchend="stopShoot()">🔫</button>
            <button class="mobile-btn right-btn" onmousedown="startMoveRight()" onmouseup="stopMoveRight()" ontouchstart="startMoveRight()" ontouchend="stopMoveRight()">→</button>
        </div>
        
        <div id="gameOverScreen">
            <h2 class="game-title">Игра окончена!</h2>
            <p class="game-subtitle">Ваш счет: <span id="finalScore">0</span></p>
            <button class="game-button" onclick="playAgain()">Играть снова</button>
        </div>
        
        <div id="nextLevelScreen">
            <h2 class="game-title">Этап <span id="nextLevelNumber">2</span>!</h2>
            <p class="game-subtitle">Поздравляем! Вы прошли уровень!</p>
            <button class="game-button" onclick="continueToNextStage()">Продолжить</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
    <script>
        // Проверяем загрузку PixiJS
        if (typeof PIXI === 'undefined') {
            alert('Ошибка загрузки PixiJS. Проверьте подключение к интернету.');
        }
        // Игровые переменные
        let app;
        let rocket;
        let asteroids = [];
        let bullets = [];
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameRunning = false;
        let gameSpeed = 2;
        
        // Переменные для мобильного управления
        let mobileKeys = {
            left: false,
            right: false,
            shoot: false
        };
        
        // Настройки игры
        const GAME_CONFIG = {
            width: 800,
            height: 600,
            rocketSpeed: 5,
            asteroidSpeed: 2,
            bulletSpeed: 8,
            maxAsteroids: 5,
            asteroidSpawnRate: 0.05,
            scoreToNextLevel: 1000
        };
        
        // Инициализация игры
        function initGame() {
            try {
                app = new PIXI.Application({
                    width: GAME_CONFIG.width,
                    height: GAME_CONFIG.height,
                    backgroundColor: 0x001122,
                    view: document.getElementById('gameCanvas'),
                    antialias: true
                });
                
                console.log('PixiJS загружен успешно');
                
                createBackground();
                createRocket();
                createParticleSystem();
                setupControls();
                startGameLoop();
                
                gameRunning = true;
                console.log('Игра запущена');
                
                // Создаем первый астероид для тестирования
                setTimeout(() => {
                    createAsteroid();
                    console.log('Первый астероид создан');
                }, 1000);
            } catch (error) {
                console.error('Ошибка инициализации игры:', error);
                alert('Ошибка загрузки игры. Проверьте консоль браузера.');
            }
        }
        
        // Создание фона со звездами
        function createBackground() {
            const background = new PIXI.Container();
            
            // Создаем звездное поле
            for (let i = 0; i < 100; i++) {
                const star = new PIXI.Graphics();
                star.beginFill(0xffffff);
                star.drawCircle(0, 0, Math.random() * 2);
                star.endFill();
                star.x = Math.random() * GAME_CONFIG.width;
                star.y = Math.random() * GAME_CONFIG.height;
                star.alpha = Math.random() * 0.8 + 0.2;
                background.addChild(star);
            }
            
            app.stage.addChild(background);
        }
        
        // Создание ракеты
        function createRocket() {
            rocket = new PIXI.Container();
            
            // Корпус ракеты (более яркий цвет)
            const rocketBody = new PIXI.Graphics();
            rocketBody.beginFill(0xff0000);
            rocketBody.drawRect(-15, -25, 30, 50);
            rocketBody.endFill();
            
            // Нос ракеты
            const rocketNose = new PIXI.Graphics();
            rocketNose.beginFill(0xff3333);
            rocketNose.moveTo(0, -35);
            rocketNose.lineTo(-15, -25);
            rocketNose.lineTo(15, -25);
            rocketNose.closePath();
            rocketNose.endFill();
            
            // Окна
            const windows = new PIXI.Graphics();
            windows.beginFill(0x88ccff);
            windows.drawCircle(-8, -15, 4);
            windows.drawCircle(8, -15, 4);
            windows.endFill();
            
            // Огонь двигателя
            const engine = new PIXI.Graphics();
            engine.beginFill(0xffaa00);
            engine.drawRect(-8, 25, 16, 15);
            engine.endFill();
            
            rocket.addChild(rocketBody);
            rocket.addChild(rocketNose);
            rocket.addChild(windows);
            rocket.addChild(engine);
            
            rocket.x = GAME_CONFIG.width / 2;
            rocket.y = GAME_CONFIG.height - 100;
            
            console.log('Ракета создана в позиции:', rocket.x, rocket.y);
            app.stage.addChild(rocket);
        }
        
        // Создание системы частиц
        function createParticleSystem() {
            const particleContainer = new PIXI.Container();
            app.stage.addChild(particleContainer);
            
            // Функция создания взрыва
            window.createExplosion = function(x, y) {
                for (let i = 0; i < 15; i++) {
                    const particle = new PIXI.Graphics();
                    particle.beginFill(0xffaa00);
                    particle.drawCircle(0, 0, 2);
                    particle.endFill();
                    
                    particle.x = x;
                    particle.y = y;
                    particle.vx = (Math.random() - 0.5) * 10;
                    particle.vy = (Math.random() - 0.5) * 10;
                    particle.life = 30;
                    
                    particleContainer.addChild(particle);
                    
                    const animate = () => {
                        particle.x += particle.vx;
                        particle.y += particle.vy;
                        particle.life--;
                        particle.alpha = particle.life / 30;
                        
                        if (particle.life <= 0) {
                            particleContainer.removeChild(particle);
                        } else {
                            requestAnimationFrame(animate);
                        }
                    };
                    animate();
                }
            };
        }
        
        // Создание астероида
        function createAsteroid() {
            const asteroid = new PIXI.Container();
            
            // Создаем простой круглый астероид для лучшей видимости
            const asteroidGraphics = new PIXI.Graphics();
            asteroidGraphics.beginFill(0x8B4513);
            asteroidGraphics.lineStyle(2, 0x654321);
            asteroidGraphics.drawCircle(0, 0, 20);
            asteroidGraphics.endFill();
            
            // Добавляем текстуру
            asteroidGraphics.beginFill(0x654321);
            asteroidGraphics.drawCircle(-5, -3, 4);
            asteroidGraphics.drawCircle(5, 3, 3);
            asteroidGraphics.endFill();
            
            console.log('Астероид создан в позиции:', asteroid.x, asteroid.y);
            
            asteroid.addChild(asteroidGraphics);
            
            asteroid.x = Math.random() * (GAME_CONFIG.width - 50) + 25;
            asteroid.y = -50;
            asteroid.rotation = Math.random() * Math.PI * 2;
            asteroid.rotationSpeed = (Math.random() - 0.5) * 0.1;
            asteroid.speed = gameSpeed + Math.random() * 2;
            
            asteroids.push(asteroid);
            app.stage.addChild(asteroid);
        }
        
        // Создание пули
        function createBullet(x, y) {
            const bullet = new PIXI.Graphics();
            bullet.beginFill(0xffff00);
            bullet.drawCircle(0, 0, 3);
            bullet.endFill();
            
            bullet.x = x;
            bullet.y = y;
            bullet.speed = GAME_CONFIG.bulletSpeed;
            
            bullets.push(bullet);
            app.stage.addChild(bullet);
        }
        
        // Управление
        function setupControls() {
            const keys = {};
            
            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
            });
            
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });
            
            // Обновление управления в игровом цикле
            window.gameKeys = keys;
        }
        
        // Обновление ракеты
        function updateRocket() {
            // Управление с клавиатуры
            if (gameKeys['ArrowLeft'] && rocket.x > 30) {
                rocket.x -= GAME_CONFIG.rocketSpeed;
            }
            if (gameKeys['ArrowRight'] && rocket.x < GAME_CONFIG.width - 30) {
                rocket.x += GAME_CONFIG.rocketSpeed;
            }
            
            // Мобильное управление
            if (mobileKeys.left && rocket.x > 30) {
                rocket.x -= GAME_CONFIG.rocketSpeed;
            }
            if (mobileKeys.right && rocket.x < GAME_CONFIG.width - 30) {
                rocket.x += GAME_CONFIG.rocketSpeed;
            }
            
            // Стрельба с клавиатуры
            if (gameKeys['Space']) {
                if (!window.lastShot || Date.now() - window.lastShot > 200) {
                    createBullet(rocket.x, rocket.y - 30);
                    window.lastShot = Date.now();
                }
            }
            
            // Мобильная стрельба
            if (mobileKeys.shoot) {
                if (!window.lastShot || Date.now() - window.lastShot > 200) {
                    createBullet(rocket.x, rocket.y - 30);
                    window.lastShot = Date.now();
                }
            }
        }
        
        // Обновление астероидов
        function updateAsteroids() {
            // Создание новых астероидов
            if (Math.random() < GAME_CONFIG.asteroidSpawnRate * (1 + level * 0.3)) {
                createAsteroid();
            }
            
            // Обновление существующих астероидов
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                asteroid.y += asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
                
                // Удаление астероидов за экраном
                if (asteroid.y > GAME_CONFIG.height + 50) {
                    app.stage.removeChild(asteroid);
                    asteroids.splice(i, 1);
                    score += 10;
                    updateScore();
                }
            }
        }
        
        // Обновление пуль
        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y -= bullet.speed;
                
                // Удаление пуль за экраном
                if (bullet.y < -10) {
                    app.stage.removeChild(bullet);
                    bullets.splice(i, 1);
                }
            }
        }
        
        // Проверка коллизий
        function checkCollisions() {
            // Коллизии пуль с астероидами
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const asteroid = asteroids[j];
                    const distance = Math.sqrt(
                        Math.pow(bullet.x - asteroid.x, 2) + 
                        Math.pow(bullet.y - asteroid.y, 2)
                    );
                    
                    if (distance < 25) {
                        // Взрыв
                        createExplosion(asteroid.x, asteroid.y);
                        
                        // Удаление объектов
                        app.stage.removeChild(bullet);
                        app.stage.removeChild(asteroid);
                        bullets.splice(i, 1);
                        asteroids.splice(j, 1);
                        
                        score += 50;
                        updateScore();
                        break;
                    }
                }
            }
            
            // Коллизии ракеты с астероидами
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const asteroid = asteroids[i];
                const distance = Math.sqrt(
                    Math.pow(rocket.x - asteroid.x, 2) + 
                    Math.pow(rocket.y - asteroid.y, 2)
                );
                
                if (distance < 30) {
                    // Взрыв
                    createExplosion(rocket.x, rocket.y);
                    
                    // Удаление астероида
                    app.stage.removeChild(asteroid);
                    asteroids.splice(i, 1);
                    
                    lives--;
                    updateLives();
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            }
        }
        
        // Обновление счета
        function updateScore() {
            document.getElementById('score').textContent = score;
            
            // Переход на следующий уровень при достижении 1000 очков
            if (score >= 1000 && gameRunning) {
                nextLevel();
            }
        }
        
        // Обновление жизней
        function updateLives() {
            document.getElementById('lives').textContent = lives;
        }
        
        // Следующий уровень
        function nextLevel() {
            gameRunning = false;
            level++;
            document.getElementById('nextLevelNumber').textContent = level;
            document.getElementById('nextLevelScreen').style.display = 'flex';
            
            // Очистка экрана от объектов
            asteroids.forEach(asteroid => app.stage.removeChild(asteroid));
            bullets.forEach(bullet => app.stage.removeChild(bullet));
            asteroids = [];
            bullets = [];
            
            // Увеличение сложности
            gameSpeed += 0.5;
        }
        
        // Переход на следующий этап (по ссылке)
        function continueToNextStage() {
            // Здесь можно указать любую ссылку
            const nextStageUrl = 'https://github.com/CastielSpn'; // Замените на нужную ссылку
            
            // Переход по ссылке
            window.location.href = nextStageUrl;
        }
        
        // Играть снова (переход по ссылке)
        function playAgain() {
            // Переход на ту же ссылку при перезапуске
            const playAgainUrl = 'https://github.com/CastielSpn'; // Замените на нужную ссылку
            
            // Переход по ссылке
            window.location.href = playAgainUrl;
        }
        
        // Начать следующий уровень (старая функция, оставлена для совместимости)
        function startNextLevel() {
            document.getElementById('nextLevelScreen').style.display = 'none';
            gameRunning = true;
            lives = 3;
            updateLives();
        }
        
        // Конец игры
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }
        
        // Перезапуск игры
        function restartGame() {
            score = 0;
            level = 1;
            lives = 3;
            gameSpeed = 2;
            
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
            document.getElementById('gameOverScreen').style.display = 'none';
            
            // Очистка экрана
            asteroids.forEach(asteroid => app.stage.removeChild(asteroid));
            bullets.forEach(bullet => app.stage.removeChild(bullet));
            asteroids = [];
            bullets = [];
            
            gameRunning = true;
        }
        
        // Функции мобильного управления
        function startMoveLeft() {
            mobileKeys.left = true;
        }
        
        function stopMoveLeft() {
            mobileKeys.left = false;
        }
        
        function startMoveRight() {
            mobileKeys.right = true;
        }
        
        function stopMoveRight() {
            mobileKeys.right = false;
        }
        
        function startShoot() {
            mobileKeys.shoot = true;
        }
        
        function stopShoot() {
            mobileKeys.shoot = false;
        }
        
        // Основной игровой цикл
        function startGameLoop() {
            let frameCount = 0;
            function gameLoop() {
                frameCount++;
                if (gameRunning) {
                    updateRocket();
                    updateAsteroids();
                    updateBullets();
                    checkCollisions();
                    
                    // Отладочная информация каждые 60 кадров (1 секунда)
                    if (frameCount % 60 === 0) {
                        console.log('Игра работает. Астероидов:', asteroids.length, 'Пуль:', bullets.length);
                    }
                }
                requestAnimationFrame(gameLoop);
            }
            gameLoop();
        }
        
        // Запуск игры при загрузке страницы
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
